services:
  diary:
    build: .
    image: introspection-diary
    container_name: diary
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: America/New_York # set to your time zone
      # Logins must come over HTTPS (your reverse proxy), except from http://localhost:3000 on
      # this machine. Set to "false" to allow plain-HTTP logins from any device.
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/data # the SQLite database lives here; back up this folder
